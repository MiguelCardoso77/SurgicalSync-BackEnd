idth:1.0;" width="10" x="318.6978" y="516.5781"/><polygon fill="#181818" points="306.6978,152.5332,316.6978,156.5332,306.6978,160.5332,310.6978,156.5332" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="48.6172" x2="312.6978" y1="156.5332" y2="156.5332"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="55.6172" y="151.2705">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.0488" x="66.8472" y="151.2705">asks to request an operation</text><polygon fill="#181818" points="59.6172,201.1152,49.6172,205.1152,59.6172,209.1152,55.6172,205.1152" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="53.6172" x2="322.6978" y1="205.1152" y2="205.1152"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="65.6172" y="191.207">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.0952" x="76.8472" y="182.5615">shows the list of the available</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.8633" x="80.459" y="199.8525">operation types and asks to select one</text><polygon fill="#181818" points="306.6978,249.6973,316.6978,253.6973,306.6978,257.6973,310.6978,253.6973" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="48.6172" x2="312.6978" y1="253.6973" y2="253.6973"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="55.6172" y="239.7891">3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.8989" x="66.8472" y="231.1436">selects one of the</text><text fill="#000000" font-family="sans-serif" font-si