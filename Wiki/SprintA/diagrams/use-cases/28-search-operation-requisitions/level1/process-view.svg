" font-weight="bold" lengthAdjust="spacing" textLength="209.6606" x="85.1709" y="282.5674">[the requested operation request exists]</text><polygon fill="#181818" points="59.6172,324.5703,49.6172,328.5703,59.6172,332.5703,55.6172,328.5703" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="53.6172" x2="495.4893" y1="328.5703" y2="328.5703"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="65.6172" y="314.6621">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="412.6421" x="76.8472" y="306.0166">shows the operation requests details (eg., patient name, operation type,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="382.9541" x="80.459" y="323.3076">priority, deadlineDate, licenseNumber and medicalRecordNumber)</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="10" x2="561.2856" y1="337.5703" y2="337.5703"/><polygon fill="#181818" points="59.6172,357.8613,49.6172,361.8613,59.6172,365.8613,55.6172,361.8613" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="53.6172" x2="500.4893" y1="361.8613" y2="361.8613"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="65.6172" y="356.5986">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.2681" x="76.8472" y="356.5986">shows error message</text><!--SRC=[bP8nJyCm48Lt_ufJ9f1I1YQ4K1V2I0TI1YIMgtrjB1mxs1UW_vvp4XfGYmGP4jc-k_VUvs3FmVVjXg9IQykEe7YylRo21TI4KJSGEeh8DdY8zDfJubGeXPf3XA8A-Li09gXKXv6jjXrwXkBcfjudfdQvX6SFTHztLgEhzruFrVLJlRwx7-RODsIITbN1OZaTN1-qW0EaqSXM58_DA0No7EPCW_FUy1hNi93HrJMa9hpBo8R0sEsM8edLhNLCCS6PDILqCbmsLzXIcOstPBBl1z8XcjM0gPnDhFST0Ne3HgGVqE_eF3TnWmmQFM