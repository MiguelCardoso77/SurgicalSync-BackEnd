316.9873">confirms deletion</text><line style="stroke:#181818;stroke-width:1.0;" x1="299.856" x2="341.856" y1="370.832" y2="370.832"/><line style="stroke:#181818;stroke-width:1.0;" x1="341.856" x2="341.856" y1="370.832" y2="383.832"/><line style="stroke:#181818;stroke-width:1.0;" x1="300.856" x2="341.856" y1="383.832" y2="383.832"/><polygon fill="#181818" points="310.856,379.832,300.856,383.832,310.856,387.832,306.856,383.832" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="306.856" y="356.9238">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.3252" x="318.0859" y="348.2783">removes the operation request</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.1763" x="321.6978" y="365.5693">from the patient's medical record</text><line style="stroke:#181818;stroke-width:1.0;" x1="299.856" x2="341.856" y1="415.123" y2="415.123"/><line style="stroke:#181818;stroke-width:1.0;" x1="341.856" x2="341.856" y1="415.123" y2="428.123"/><line style="stroke:#181818;stroke-width:1.0;" x1="300.856" x2="341.856" y1="428.123" y2="428.123"/><polygon fill="#181818" points="310.856,424.123,300.856,428.123,310.856,432.123,306.856,428.123" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="306.856" y="409.8604">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.9834" x="318.0859" y="409.8604">logs the deletion action</text><polygon fill="#181818" points="59.6172,455.4141,49.6172,459.4141,59.6172,463.4141,55.6172,459.4141" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="53.6172" x2="288.856" y1="459.4141" y2="459.4141"/><text f