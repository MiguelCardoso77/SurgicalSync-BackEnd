"spacing" textLength="197.9961" x="66.8472" y="213.8525">Inserts the operation requisition ID</text><path d="M10,234.1152 L70.1709,234.1152 L70.1709,243.4063 L60.1709,253.4063 L10,253.4063 L10,234.1152 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="312.5117" style="stroke:#000000;stroke-width:1.5;" width="614.7026" x="10" y="234.1152"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.1709" x="25" y="249.1436">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="303.7407" x="85.1709" y="247.9854">[the logged in doctor is the one who created the operation</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="247.5376" x="88.2271" y="262.6162">request and the operation is not yet scheduled]</text><polygon fill="#181818" points="59.6172,286.959,49.6172,290.959,59.6172,294.959,55.6172,290.959" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="53.6172" x2="309.7505" y1="290.959" y2="290.959"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="65.6172" y="285.6963">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155.3398" x="76.8472" y="285.6963">shows confirmation prompt</text><polygon fill="#181818" points="293.7505,318.25,303.7505,322.25,293.7505,326.25,297.7505,322.25" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="48.6172" x2="299.7505" y1="322.25" y2="322.25"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="55.6172" y="316.9873">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.2681" x="66.8472" y="316.9873">confirms deletion</text><line style="stroke:#181818;stroke-width:1.0;" x1="315.7505" x2="357.7505" y1="370.832" y2="370.832"/><line style="stroke:#181818;stroke-width:1.0;" x1="357.7505" x2="357.7505" y1="370.832" y2="383.832"/><line style="stroke:#181818;stroke-width:1.0;" x1="316.7505" x2="357.7505" y1="383.832" y2="383.832"/><polygon fill="#181818" points="326.7505,379.832,316.7505,383.832,326.7505,387.832,322.7505,383.832" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="322.7505" y="356.9238">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.3252" x="333.9805" y="348.2783">removes the operation request</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.1763" x="337.5923" y="365.5693">from the patient's medical record</text><line style="stroke:#181818;stroke-width:1.0;" x1="315.7505" x2="357.7505" y1="415.123" y2="415.123"/><line style="stroke:#181818;stroke-width:1.0;" x1="357.7505" x2="357.7505" y1="415.123" y2="428.123"/><line style="stroke:#181818;stroke-width:1.0;" x1="316.7505" x2="357.7505" y1="428.123" y2="428.123"/><polygon fill="#181818" points="326.7505,424.123,316.7505,428.123,326.7505,432.123,322.7505,428.123" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="322.7505" y="409.8604">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.9834" x="333.9805" y="409.8604">logs the deletion action</text><polygon fill="#181818" points="59.6172,455.4141,49.6172,459.4141,59.6172,463.4141,55.6172,459.4141" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="53.6172" x2="304.7505" y1="459.4141" y2="459.4141"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="65.6172" y="454.1514">8</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.2407" x="76.8472" y="454.1514">shows operation success</text><polygon fill="#181818" points="535.7686,486.7051,545.7686,490.7051,535.7686,494.7051,539.7686,490.7051" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="315.7505" x2="541.7686" y1="490.7051" y2="490.7051"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="322.7505" y="485.4424">9</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.0488" x="333.9805" y="485.4424">notify to update schedules</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="10" x2="624.7026" y1="499.7051" y2="499.7051"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="265.8477" x="15" y="511.5752">[The doctor is not authorized to delete the request]</text><polygon fill="#181818" points="59.6172,534.627,49.6172,538.627,59.6172,542.627,55.6172,538.627" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="53.6172" x2="309.7505" y1="538.627" y2="538.627"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.46" x="65.6172" y="533.3643">10</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.2681" x="84.0771" y="533.3643">shows error message</text><!--SRC=[ZPB1Qjn038RlynJ2bvpsqaiW14EfIrXebX1l3uLS9ZEoFSGUEJDomkRfex6zgNVhj3tDWAHFltv93qn-w1unABLtt29aFxzzkOGDt6D7BmZQ0_KOD3lo4F1vSD6bVwQKDam1ieBIcu6EK